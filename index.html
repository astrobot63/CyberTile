<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberTile | Jump over Cities</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050a;
      font-family: 'Orbitron', sans-serif;
      color: #ffffff;
    }
    #game-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .ui-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
    }
    .interactive {
      pointer-events: auto;
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 10, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.3s ease;
    }
    .screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    h1 {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #00ffff;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.6), 0 0 40px rgba(0, 255, 255, 0.3);
      margin-bottom: 10px;
      text-align: center;
    }
    p.subtitle {
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #a0a0c0;
      margin-bottom: 40px;
      text-align: center;
    }
    .btn {
      background: linear-gradient(135deg, #00ffff 0%, #0088ff 100%);
      color: #05050a;
      border: none;
      padding: 15px 40px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 2px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      margin: 10px;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 1.5rem;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }
    .hud-stat {
      background: rgba(10, 10, 25, 0.6);
      border: 1px solid rgba(0, 255, 255, 0.3);
      padding: 10px 20px;
      border-radius: 10px;
      backdrop-filter: blur(5px);
    }
    .menu-actions { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; }
    .shop-trigger {
      width: 62px; height: 62px; border: 1px solid rgba(0,255,255,.65); border-radius: 50%;
      background: rgba(8,18,38,.85); color: #00ffff; font-size: 1.8rem; cursor: pointer;
      box-shadow: 0 0 20px rgba(0,255,255,.3); transition: transform .2s, box-shadow .2s;
    }
    .shop-trigger:hover { transform: scale(1.08); box-shadow: 0 0 30px rgba(0,255,255,.7); }
    .shop-screen { padding: 28px; overflow-y: auto; }
    .shop-screen h1 { margin: 0; }
    .shop-balance { color: #ffda66; margin: 8px 0 22px; }
    .shop-items { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; width: min(760px, 92vw); max-height: 55vh; overflow-y: auto; padding: 5px; }
    .shop-item { background: rgba(12,20,42,.92); border: 1px solid rgba(0,255,255,.32); border-radius: 14px; padding: 16px 12px; text-align: center; }
    .skin-preview { width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 10px; box-shadow: 0 0 22px currentColor; }
    .shop-item h2 { font-size: .95rem; color: #fff; margin-bottom: 7px; }
    .shop-item p { font-size: .78rem; color: #a0a0c0; margin-bottom: 10px; }
    .shop-item .btn { font-size: .75rem; padding: 9px 13px; margin: 3px; }
    .shop-close { margin-top: 12px; }
    @media (max-width: 600px) { h1 { font-size: 2.4rem; } .shop-screen { padding: 14px; } .shop-items { grid-template-columns: repeat(2, minmax(130px, 1fr)); } }
  </style>
</head>
<body>
  <!-- Three.js Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- In-Game HUD -->
  <div class="ui-layer">
    <div class="hud-top">
      <div class="hud-stat">SCORE: <span id="score-val">0</span></div>
      <div class="hud-stat">BEST: <span id="best-val">0</span></div>
    </div>
  </div>

  <!-- Main Menu Screen -->
  <div id="main-menu" class="screen interactive">
    <h1>DON'T TOUCH<br>THE SAME</h1>
    <p class="subtitle">A Futuristic 3D Arcade Survival Experience</p>
    <div class="menu-actions">
      <button class="btn" id="start-btn">PLAY GAME</button>
      <button class="shop-trigger" id="shop-open-btn" aria-label="Open shop" title="Shop">🛒</button>
    </div>
  </div>

  <div id="shop-screen" class="screen shop-screen hidden interactive" aria-label="Shop">
    <h1>NEON SHOP</h1>
    <p class="shop-balance">CREDITS: <span id="credits-val">0</span></p>
    <div id="shop-items" class="shop-items"></div>
    <button class="btn shop-close" id="shop-close-btn">BACK</button>
  </div>

  <!-- Game Over Screen -->
  <div id="game-over-screen" class="screen hidden interactive">
    <h1>SYSTEM CRASH</h1>
    <p class="subtitle">You died!</p>
    <div style="margin-bottom: 20px; font-size: 1.3rem; text-align: center;">
      Final Score: <span id="final-score" style="color: #00ffff; font-weight: 700;">0</span>
    </div>
    <button class="btn" id="restart-btn">TRY AGAIN</button>
  </div>

  <a href="./developer.html">The Developer</a>

  <!-- App Entry Point -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
