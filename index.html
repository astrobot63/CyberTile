<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberTile | Jump over Cities</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050a;
      font-family: 'Orbitron', sans-serif;
      color: #ffffff;
    }
    #game-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }
    .ui-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
    }
    .interactive {
      pointer-events: auto;
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 10, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.3s ease;
    }
    .screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    h1 {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #00ffff;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.6), 0 0 40px rgba(0, 255, 255, 0.3);
      margin-bottom: 10px;
      text-align: center;
    }
    p.subtitle {
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #a0a0c0;
      margin-bottom: 40px;
      text-align: center;
    }
    .btn {
      background: linear-gradient(135deg, #00ffff 0%, #0088ff 100%);
      color: #05050a;
      border: none;
      padding: 15px 40px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 2px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      margin: 10px;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 1.5rem;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }
    .hud-stat {
      background: rgba(10, 10, 25, 0.6);
      border: 1px solid rgba(0, 255, 255, 0.3);
      padding: 10px 20px;
      border-radius: 10px;
      backdrop-filter: blur(5px);
    }
    .hud-coins { color: #ffda66; }
    .menu-actions { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; }
    .shop-trigger {
      position: fixed; top: 30px; left: 30px; z-index: 40; pointer-events: auto;
      width: 48px; height: 48px; border: 1px solid rgba(0,255,255,.65); border-radius: 50%;
      background: rgba(8,18,38,.85); color: #00ffff; font-size: 1.8rem; cursor: pointer;
      box-shadow: 0 0 20px rgba(0,255,255,.3); transition: transform .2s, box-shadow .2s;
    }
    .shop-trigger:hover { transform: scale(1.08); box-shadow: 0 0 30px rgba(0,255,255,.7); }
    .shop-screen { z-index: 50; justify-content: flex-start; padding: 48px 28px 28px; overflow-y: auto; }
    .shop-screen h1 { margin: 0; }
    .shop-balance {
      display: none; position: fixed; top: 24px; right: 24px; z-index: 100; color: #ffda66; margin: 0; padding: 10px 18px;
      border: 1px solid rgba(255,218,102,.4); border-radius: 22px; background: rgba(12,20,42,.96);
      box-shadow: 0 0 18px rgba(255,218,102,.18); font-size: .95rem;
    }
    .shop-notice {
      position: fixed; top: auto; bottom: 24px; left: 50%; z-index: 1000; width: min(520px, 90vw);
      transform: translate(-50%, 10px); margin: 0; padding: 16px 22px;
      border: 2px solid #ff8299; border-radius: 14px; background: rgba(8, 13, 30, .98);
      box-shadow: 0 0 30px rgba(255, 70, 120, .5); color: #fff; font-size: 1rem;
      font-weight: 700; letter-spacing: .5px; text-align: center; opacity: 0;
      visibility: hidden; pointer-events: none; transition: opacity .2s ease, transform .2s ease, visibility .2s;
    }
    .shop-notice.visible { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
    .shop-notice.success { border-color: #70ffb0; box-shadow: 0 0 30px rgba(50, 255, 150, .45); }
    .shop-notice.error { border-color: #ff8299; box-shadow: 0 0 30px rgba(255, 70, 120, .5); }
    .shop-section-title { width: min(760px, 92vw); color: #8efaff; font-size: .85rem; letter-spacing: 2px; margin: 18px 0 0; text-align: left; }
    .shop-items { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; width: min(760px, 92vw); padding: 5px; }
    .shop-item { background: rgba(12,20,42,.92); border: 1px solid rgba(0,255,255,.32); border-radius: 14px; padding: 16px 12px; text-align: center; }
    .skin-preview { width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 10px; box-shadow: 0 0 22px currentColor; }
    .shop-item h2 { font-size: .95rem; color: #fff; margin-bottom: 7px; }
    .shop-item p { font-size: .78rem; color: #a0a0c0; margin-bottom: 10px; }
    .powerup-icon { font-size: 2rem; margin: 0 auto 8px; filter: drop-shadow(0 0 10px currentColor); }
    .powerup-stock { color: #ffda66 !important; }
    .shop-item .btn { font-size: .75rem; padding: 9px 13px; margin: 3px; }
    .shop-close {
      display: none; position: fixed; top: 24px; left: 24px; z-index: 1000; margin: 0;
      padding: 10px 20px; font-size: .8rem;
    }
    .music-toggle {
      position: fixed; top: 94px; right: 30px; z-index: 40; pointer-events: auto;
      border: 1px solid rgba(0,255,255,.45); border-radius: 24px;
      padding: 10px 15px; color: #bafcff; background: rgba(8,18,38,.88);
      font: 700 .72rem 'Orbitron', sans-serif; letter-spacing: 1px; cursor: pointer;
      box-shadow: 0 0 16px rgba(0,255,255,.18); backdrop-filter: blur(8px);
    }
    .music-toggle:hover { border-color: #00ffff; box-shadow: 0 0 22px rgba(0,255,255,.45); }
    .settings-trigger {
      position: fixed; top: 30px; right: 30px; z-index: 40; pointer-events: auto;
      width: 48px; height: 48px; border: 1px solid rgba(0,255,255,.45); border-radius: 50%;
      color: #bafcff; background: rgba(8,18,38,.88); font-size: 1.35rem; cursor: pointer;
      box-shadow: 0 0 16px rgba(0,255,255,.18); backdrop-filter: blur(8px);
    }
    .settings-trigger:hover { border-color: #00ffff; box-shadow: 0 0 22px rgba(0,255,255,.45); }
    .settings-screen { z-index: 50; gap: 14px; padding: 24px; }
    .settings-screen h1 { margin: 0; }
    .settings-row {
      display: grid; grid-template-columns: 160px minmax(150px, 280px) 44px; align-items: center;
      gap: 14px; width: min(540px, 90vw); padding: 16px 18px; border-radius: 12px;
      border: 1px solid rgba(0,255,255,.28); background: rgba(12,20,42,.92);
      color: #d8faff; font-size: .85rem; letter-spacing: 1px;
    }
    .settings-row input { width: 100%; accent-color: #00ffff; cursor: pointer; }
    .settings-row output { color: #00ffff; text-align: right; }
    .settings-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .danger-btn { background: linear-gradient(135deg, #ff466a, #b91546); color: #fff; box-shadow: 0 0 20px rgba(255,40,90,.28); }
    .confirm-screen { z-index: 60; }
    .confirm-actions { display: flex; justify-content: center; flex-wrap: wrap; }
    @media (max-width: 600px) {
      .settings-trigger { top: 18px; right: 18px; }
      .shop-trigger { top: 18px; left: 18px; }
      .settings-row { grid-template-columns: 1fr 44px; gap: 8px; }
      .settings-row input { grid-column: 1; grid-row: 2; }
      .settings-row output { grid-column: 2; grid-row: 1 / span 2; }
    }
    @media (max-width: 600px) {
      h1 { font-size: 2.4rem; }
      .shop-screen { padding: 70px 14px 14px; }
      .shop-close { top: 14px; left: 14px; }
      .shop-balance { top: 14px; right: 14px; padding: 9px 12px; font-size: .75rem; }
      .shop-notice { bottom: max(18px, env(safe-area-inset-bottom)); }
      .shop-items { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
      .music-toggle { top: 88px; right: 18px; }
      .ui-layer { padding: 18px; }
      .hud-top { gap: 6px; font-size: .76rem; }
      .hud-stat { padding: 7px 8px; white-space: nowrap; }
    }
  </style>
</head>
<body>
  <!-- Three.js Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- In-Game HUD -->
  <div class="ui-layer">
    <div class="hud-top">
      <div class="hud-stat">SCORE: <span id="score-val">0</span></div>
      <div class="hud-stat hud-coins">🪙 COINS: <span id="coins-val">0</span></div>
      <div class="hud-stat">BEST: <span id="best-val">0</span></div>
    </div>
  </div>

  <!-- Main Menu Screen -->
  <div id="main-menu" class="screen interactive">
    <h1>CYBER<br>TILE</h1>
    <p class="subtitle">JUMP OVER CITIES</p>
    <div class="menu-actions">
      <button class="btn" id="start-btn">PLAY GAME</button>
    </div>
  </div>

  <div id="shop-screen" class="screen shop-screen hidden interactive" aria-label="Shop">
    <h1>NEON SHOP</h1>
    <h2 class="shop-section-title">BALL SKINS</h2>
    <div id="shop-skins" class="shop-items"></div>
    <h2 class="shop-section-title">POWERUPS · ACTIVATE NEXT RUN</h2>
    <div id="shop-powerups" class="shop-items"></div>
  </div>
  <button class="btn shop-close interactive" id="shop-close-btn">BACK</button>
  <p id="shop-balance" class="shop-balance">YOUR COINS: 🪙 <span id="credits-val">0</span></p>
  <p id="shop-notice" class="shop-notice" role="status" aria-live="polite"></p>

  <!-- Game Over Screen -->
  <div id="game-over-screen" class="screen hidden interactive">
    <h1>SYSTEM CRASH</h1>
    <p class="subtitle">You died!</p>
    <div style="margin-bottom: 20px; font-size: 1.3rem; text-align: center;">
      Final Score: <span id="final-score" style="color: #00ffff; font-weight: 700;">0</span>
    </div>
    <button class="btn" id="restart-btn">TRY AGAIN</button>
  </div>

  <button class="shop-trigger interactive" id="shop-open-btn" aria-label="Open shop" title="Shop">🛒</button>
  <button id="music-toggle" class="music-toggle interactive" type="button" aria-label="Toggle ambient music" aria-pressed="true">♫ MUSIC ON</button>
  <button id="settings-open-btn" class="settings-trigger interactive" type="button" aria-label="Open settings" title="Settings">⚙</button>

  <div id="settings-screen" class="screen settings-screen hidden interactive" aria-label="Settings">
    <h1>SETTINGS</h1>
    <label class="settings-row" for="sfx-volume">
      <span>SFX SOUND</span>
      <input id="sfx-volume" type="range" min="0" max="100" value="100">
      <output id="sfx-volume-value" for="sfx-volume">100%</output>
    </label>
    <label class="settings-row" for="music-volume">
      <span>MUSIC SOUND</span>
      <input id="music-volume" type="range" min="0" max="100" value="100">
      <output id="music-volume-value" for="music-volume">100%</output>
    </label>
    <div class="settings-actions">
      <button id="reset-progress-btn" class="btn danger-btn" type="button">RESET ALL PROGRESS</button>
      <button id="settings-close-btn" class="btn" type="button">BACK</button>
    </div>
  </div>

  <div id="reset-confirm-screen" class="screen confirm-screen hidden interactive" role="alertdialog" aria-modal="true" aria-labelledby="reset-confirm-title">
    <h1 id="reset-confirm-title">RESET PROGRESS?</h1>
    <p class="subtitle">All coins, skins, and scores will be deleted.</p>
    <div class="confirm-actions">
      <button id="reset-cancel-btn" class="btn" type="button">CANCEL</button>
      <button id="reset-confirm-btn" class="btn danger-btn" type="button">YES, RESET</button>
    </div>
  </div>

  <!-- App Entry Point -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
